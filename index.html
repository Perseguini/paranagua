<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Alerta Fila | Perseguini</title>

<!-- PWA: manifest + ícone + cor da barra do navegador -->
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="theme-color" content="#0a1a2b" />

<!-- Estilo separado em arquivo próprio -->
<link rel="stylesheet" href="style.css" />

<!--
  =====================================================================
  ALERTA FILA - PERSEGUINI
  =====================================================================
  App de 1 tela pra ativar/desativar o alerta automático da fila de
  caminhões (CARGA LIVE -> Telegram), rodando no seu Apps Script, e
  também consultar a data/hora do agendamento pelo número da nota fiscal.

  COMO INSTALAR NO CELULAR (tipo um app):
  1. Hospede este arquivo em algum lugar com link público (ex: o
     GitHub Pages que você já usa, ou até dentro do próprio Apps
     Script como mais um doGet).
  2. Abra o link no navegador do celular.
  3. Menu (3 pontinhos) > "Adicionar à tela inicial".
  4. Pronto, vira um ícone de app.

  O QUE VOCÊ PRECISA EDITAR (só aqui embaixo, no bloco CONFIG):
  - URL_ATIVAR    -> o link ".../exec?acao=iniciar" da sua implantação
  - URL_PARAR     -> o link ".../exec?acao=parar" da sua implantação
  - URL_CONSULTA  -> o link do SEU Apps Script que consulta o
                     agendamento (veja o comentário grande logo acima
                     da função consultarAgendamento() lá embaixo,
                     explica por que precisa ser um script seu e não
                     o site da ATEXP direto).
  - FOTO_URL      -> o link de uma foto/logo sua (ou do caminhão) pra
                     aparecer no topo do app. Pode ser uma imagem
                     hospedada no Google Drive (link direto), Imgur, etc.
  - NOME_APP      -> o texto que aparece embaixo da foto.
  =====================================================================
-->
</head>
<body>

<div class="tela">

  <!-- ============= CABEÇALHO / PERSONALIZAÇÃO ============= -->
  <div class="avatar-wrap">
    <!--
      EDITE AQUI: troque o "src" pela URL da sua foto (ou logo do
      caminhão). Se não tiver uma pronta, deixei um ícone de caminhão
      como placeholder via emoji abaixo do <img> (caso a imagem falhe
      em carregar, o onerror troca pelo emoji).
    -->
    <img
      class="avatar"
      id="fotoPerfil"
      src="COLE_AQUI_A_URL_DA_SUA_FOTO.jpg"
      alt="Foto de perfil"
      onerror="this.onerror=null; this.replaceWith(Object.assign(document.createElement('div'), {className:'avatar', style:'display:flex;align-items:center;justify-content:center;font-size:44px;', textContent:'🚛'}));"
    />
  </div>

  <div class="nome-app titulo-estrada">Alerta Fila</div>
  <div class="subtitulo">Perseguini · CARGA LIVE</div>

  <!-- ============= STATUS ATUAL (visual, local) ============= -->
  <div class="status-card">
    <div class="status-dot" id="statusDot"></div>
    <div class="status-texto">
      <span id="statusTexto">Toque em um botão abaixo</span>
      <small id="statusHora"></small>
    </div>
  </div>

  <!-- ============= BOTÕES DE AÇÃO ============= -->
  <div class="botoes">
    <button class="acao btn-ativar" id="btnAtivar" onclick="ativarAlerta()">
      <span class="icone">▶️</span> Ativar alerta
    </button>
    <button class="acao btn-parar" id="btnParar" onclick="pararAlerta()">
      <span class="icone">⏹️</span> Desativar alerta
    </button>
  </div>

  <!-- ============= CONSULTA DE AGENDAMENTO (novo) =============
       Digita o número da NF e mostra a data/hora prevista de chegada,
       igual à tela de consulta da ATEXP. -->
  <div class="consulta-wrap">
    <div class="consulta-titulo">Consultar agendamento pela nota fiscal</div>
    <div class="consulta-form">
      <input
        class="consulta-input"
        id="inputNF"
        type="text"
        inputmode="numeric"
        placeholder="Número da NF"
        onkeydown="if(event.key==='Enter'){consultarAgendamento();}"
      />
      <button class="btn-consultar" id="btnConsultar" onclick="consultarAgendamento()">
        🔍 Consultar
      </button>
    </div>

    <div class="resultado-card" id="resultadoCard">
      <div class="resultado-status" id="resultadoStatus"></div>
      <div class="resultado-datahora" id="resultadoDataHora"></div>
      <div class="resultado-linha" id="linhaPlaca" style="display:none;">
        <span>Placa</span><b id="valorPlaca"></b>
      </div>
      <div class="resultado-linha" id="linhaProduto" style="display:none;">
        <span>Produto</span><b id="valorProduto"></b>
      </div>
      <div class="resultado-linha" id="linhaTerminal" style="display:none;">
        <span>Terminal</span><b id="valorTerminal"></b>
      </div>
    </div>
  </div>

  <!--
    Botão de instalar o app na tela inicial. Fica escondido até o
    navegador avisar que a instalação está disponível (evento
    "beforeinstallprompt", só existe em Chrome/Android e similares -
    no iPhone/Safari não existe esse botão nativo, lá a instalação
    continua sendo pelo menu "Adicionar à Tela de Início").
  -->
  <button class="acao btn-instalar" id="btnInstalar" onclick="instalarApp()" style="display:none;">
    <span class="icone">⬇️</span> Instalar app
  </button>

  <div class="rodape">Verifica a fila a cada 5 min · avisa no Telegram</div>
</div>

<script>
  /* =====================================================================
     CONFIG — edite só esta parte
     ===================================================================== */
  var URL_ATIVAR = "https://script.google.com/macros/s/AKfycbzRAzv6kthbdO27OXkgSScOnsHkjraKfVdgcaNeEmB2mgo6lsf9OEHq5mkoFH_c4ybuSQ/exec?acao=iniciar";
  var URL_PARAR  = "https://script.google.com/macros/s/AKfycbzRAzv6kthbdO27OXkgSScOnsHkjraKfVdgcaNeEmB2mgo6lsf9OEHq5mkoFH_c4ybuSQ/exec?acao=parar";

  // Link do SEU Apps Script de consulta (veja o comentário grande
  // logo acima da função consultarAgendamento() mais abaixo).
  var URL_CONSULTA = "https://script.google.com/macros/s/AKfycbxyZRTUsTuD42j2y7pJ7hmurxC0aP1Epf_1tnAKcc8ei8zd6E-xDkyR3ECWaYD_qvvrlw/exec";

  /* =====================================================================
     LÓGICA DOS BOTÕES DE ALERTA
     Usamos fetch em modo "no-cors": o navegador dispara a requisição
     pro Apps Script normalmente, mas por ser um domínio diferente
     (script.google.com), o JavaScript não consegue LER a resposta.
     Por isso não mostramos o texto que o Apps Script devolve — só
     confirmamos aqui na tela que o toque foi enviado.
     Se quiser 100% de certeza, dá uma olhada no Telegram depois.
     ===================================================================== */

  var statusDot = document.getElementById("statusDot");
  var statusTexto = document.getElementById("statusTexto");
  var statusHora = document.getElementById("statusHora");
  var btnAtivar = document.getElementById("btnAtivar");
  var btnParar = document.getElementById("btnParar");

  function horaAgora() {
    var d = new Date();
    return d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
  }

  function setBotoesOcupados(ocupado) {
    btnAtivar.disabled = ocupado;
    btnParar.disabled = ocupado;
  }

  function dispararAcao(url, textoOtimista, classeStatus) {
    if (!url || url.indexOf("URL_CONSULTA") === 0) {
      statusTexto.textContent = "⚠️ Falta configurar o link no código (veja o bloco CONFIG).";
      return;
    }

    setBotoesOcupados(true);
    statusTexto.textContent = "Enviando...";

    fetch(url, { method: "GET", mode: "no-cors" })
      .then(function () {
        // Em modo no-cors não dá pra ler a resposta real do servidor,
        // então assumimos sucesso quando a requisição não der erro de rede.
        statusDot.className = "status-dot " + classeStatus;
        statusTexto.textContent = textoOtimista;
        statusHora.textContent = "às " + horaAgora();
      })
      .catch(function () {
        statusTexto.textContent = "⚠️ Não consegui conectar. Confira sua internet.";
      })
      .finally(function () {
        setBotoesOcupados(false);
      });
  }

  function ativarAlerta() {
    dispararAcao(URL_ATIVAR, "✅ Alerta ativado (verifica a cada 5 min).", "ativo");
  }

  function pararAlerta() {
    dispararAcao(URL_PARAR, "🛑 Alerta desativado.", "parado");
  }

  /* =====================================================================
     CONSULTA DE AGENDAMENTO PELA NOTA FISCAL
     -------------------------------------------------------------------
     IMPORTANTE — por que URL_CONSULTA não pode ser o link do site da
     ATEXP direto:

     O site da ATEXP (aquele "script.google.com" da print) é um Apps
     Script de terceiros, igual o CARGA LIVE. Ele mostra o resultado
     usando "google.script.run" por dentro da própria página dele, com
     um token de sessão que só existe naquela aba carregada — não dá
     pra chamar essa URL por fetch() de um site diferente (o navegador
     bloqueia por CORS, e mesmo em modo no-cors não dá pra LER a
     resposta pra pegar a data/hora).

     A solução é a mesma que já foi usada pro CARGA LIVE: criar um
     Apps Script SEU (um projeto novo, ou uma função a mais no que já
     existe), que:
       1. Recebe a NF por parâmetro (?nf=123456)
       2. Faz a consulta por trás (UrlFetchApp, ou headless
          tipo Browserless/Puppeteer, dependendo de como o site da
          ATEXP responder à consulta)
       3. Devolve pra este app um JSON simples, por exemplo:
          { "ok": true, "placa": "AXO-9E35", "produto": "FARELO SOJA 1",
            "terminal": "ROCHA LOG", "dataHora": "07/09/2026 11:00" }

     Depois é só colar a URL desse SEU script em URL_CONSULTA acima
     que essa função já funciona sem precisar mexer em mais nada.
     ===================================================================== */

  var inputNF = document.getElementById("inputNF");
  var btnConsultar = document.getElementById("btnConsultar");
  var resultadoCard = document.getElementById("resultadoCard");
  var resultadoStatus = document.getElementById("resultadoStatus");
  var resultadoDataHora = document.getElementById("resultadoDataHora");
  var linhaPlaca = document.getElementById("linhaPlaca");
  var linhaProduto = document.getElementById("linhaProduto");
  var linhaTerminal = document.getElementById("linhaTerminal");
  var valorPlaca = document.getElementById("valorPlaca");
  var valorProduto = document.getElementById("valorProduto");
  var valorTerminal = document.getElementById("valorTerminal");

  function mostrarLinha(linhaEl, valorEl, texto) {
    if (texto) {
      valorEl.textContent = texto;
      linhaEl.style.display = "flex";
    } else {
      linhaEl.style.display = "none";
    }
  }

  function mostrarResultadoErro(mensagem) {
    resultadoCard.className = "resultado-card mostrar erro";
    resultadoStatus.textContent = "Não encontrado";
    resultadoDataHora.textContent = mensagem;
    linhaPlaca.style.display = "none";
    linhaProduto.style.display = "none";
    linhaTerminal.style.display = "none";
  }

  function consultarAgendamento() {
    var nf = inputNF.value.trim();

    if (!nf) {
      mostrarResultadoErro("Digite o número da NF.");
      return;
    }

    if (!URL_CONSULTA || URL_CONSULTA.indexOf("COLE_AQUI") === 0) {
      mostrarResultadoErro("Falta configurar URL_CONSULTA no código.");
      return;
    }

    btnConsultar.disabled = true;
    btnConsultar.textContent = "Consultando...";
    resultadoCard.className = "resultado-card mostrar";
    resultadoStatus.textContent = "Consultando...";
    resultadoDataHora.textContent = "";

    fetch(URL_CONSULTA + "?nf=" + encodeURIComponent(nf))
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (!data || !data.ok) {
          mostrarResultadoErro((data && data.erro) || "Nenhum agendamento encontrado pra essa NF.");
          return;
        }
        resultadoCard.className = "resultado-card mostrar";
        resultadoStatus.textContent = "Data/hora prevista de chegada";
        resultadoDataHora.textContent = data.dataHora || "—";
        mostrarLinha(linhaPlaca, valorPlaca, data.placa);
        mostrarLinha(linhaProduto, valorProduto, data.produto);
        mostrarLinha(linhaTerminal, valorTerminal, data.terminal);
      })
      .catch(function () {
        mostrarResultadoErro("Não consegui conectar. Confira sua internet ou a URL configurada.");
      })
      .finally(function () {
        btnConsultar.disabled = false;
        btnConsultar.textContent = "🔍 Consultar";
      });
  }

  /* =====================================================================
     PWA: registrar service worker + botão "Instalar app"
     ===================================================================== */
  if ("serviceWorker" in navigator) {
    // OBS: precisa estar servido via https (GitHub Pages já é https).
    navigator.serviceWorker.register("sw.js").catch(function (err) {
      console.warn("Falha ao registrar service worker:", err);
    });
  }

  var eventoInstalacao = null;
  var btnInstalar = document.getElementById("btnInstalar");

  // O Chrome dispara esse evento quando entende que o app cumpre os
  // requisitos de instalação (manifest + service worker + https).
  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault();
    eventoInstalacao = e;
    btnInstalar.style.display = "flex"; // só mostra o botão agora
  });

  function instalarApp() {
    if (!eventoInstalacao) return;
    eventoInstalacao.prompt();
    eventoInstalacao.userChoice.finally(function () {
      eventoInstalacao = null;
      btnInstalar.style.display = "none";
    });
  }

  // Depois de instalado, esconde o botão (não faz sentido oferecer de novo).
  window.addEventListener("appinstalled", function () {
    btnInstalar.style.display = "none";
  });
</script>

</body>
</html>
